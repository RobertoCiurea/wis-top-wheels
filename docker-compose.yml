services:
  #Keycloak database
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
  #Quarkus database
  quarkus_db:
    image: postgres:16
    container_name: quarkus-db
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - quarkus_postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
  #Keycloak server
  keycloak:
    image:  quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    command:
      - start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - app-net
networks:
  app-net:
    driver: bridge
volumes:
  keycloak_postgres_data:
  quarkus_postgres_data: